name: Retrain Model

"on":
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  retrain-model:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: final-project

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain model
        run: |
          python model/train.py

      - name: Set image metadata
        id: image
        run: |
          IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}/goit-mlops-fp"
          IMAGE_TAG="${{ github.run_number }}"
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }} \
            -t ${{ steps.image.outputs.repository }}:latest \
            .

          docker push ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          docker push ${{ steps.image.outputs.repository }}:latest

      - name: Update Helm image values
        run: |
          python - <<'PY'
          from pathlib import Path

          values_path = Path("helm/values-ghcr.yaml")
          content = values_path.read_text()

          lines = []
          for line in content.splitlines():
              if line.strip().startswith("tag:"):
                  lines.append('  tag: "${{ github.run_number }}"')
              else:
                  lines.append(line)

          values_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit updated model and Helm chart
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add model/model.pkl model/model_metadata.json helm/values-ghcr.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Retrain model and update image tag"
            git push origin final-project
          fi